# The environment of `psd_bases.jl` alone. It needs GeometricOptimizers 0.10, the first release that
# optimizes on `SymplecticStiefelManifold`; `scripts/` holds GeometricMachineLearning 0.9, which
# bounds GeometricOptimizers to 0.9. `Manifest.toml` is not tracked.
[deps]
GeometricIntegrators = "dcce2d33-59f6-5b8d-9047-0defad88ae06"
GeometricOptimizers = "fc236c15-5557-4942-aa65-b650f329279e"
GeometricProblems = "18cb22b4-ad41-5c80-9c5f-710df63fbdc9"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[compat]
GeometricIntegrators = "0.18.6, 0.19"
GeometricOptimizers = "0.10.1"
GeometricProblems = "0.10.1"
HDF5 = "0.17"
julia = "1.12"
