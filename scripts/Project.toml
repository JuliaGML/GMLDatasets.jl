# The environment for both script families.
#
# `Metal` is deliberately absent: it cannot be resolved on Linux and listing it would leave the whole
# environment unprecompilable there. A Mac adds it by hand with
#     julia --project=scripts -e 'using Pkg; Pkg.add("Metal")'
# and keeps that line out of commits. `CUDA` is different — it installs, though non-functional, on
# machines without a device, so the environment resolves everywhere and the CUDA scripts fall back to
# the host.

[deps]
AbstractNeuralNetworks = "60874f82-5ada-4c70-bd1c-fa6be7711c8a"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
GMLDatasets = "676c5310-75a3-4edf-a7af-a2dbff91674b"
GeometricMachineLearning = "194d25b2-d3f5-49f0-af24-c124f4aa80cc"
GeometricOptimizers = "fc236c15-5557-4942-aa65-b650f329279e"
GeometricProblems = "18cb22b4-ad41-5c80-9c5f-710df63fbdc9"
NeuralNetworkParameters = "67f4d93a-60e9-472b-8cdd-1ccf6005724a"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MLDatasets = "eb30cadb-4394-5ae3-aed4-317e484a6458"
NNlib = "872c559c-99b0-510c-b3b7-b6c96a88d5cd"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
ProgressMeter = "92933f4c-e287-5a05-a399-4b506db050ca"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
SimpleSolvers = "36b790f5-6434-4fbe-b711-1f64a1e2f6a2"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Zygote = "e88e6eb3-aa80-5325-afca-941959d7151f"

# `GMLDatasets` is not registered, so it is reached by path.
#
# `GeometricMachineLearning` comes from `main` rather than from the registry: the registered 0.8.0
# bounds `GeometricOptimizers` to `0.8` and `AbstractNeuralNetworks` to `0.8`, and the harness runs
# on the 0.9 line of both. `GeometricOptimizers` itself comes from the registry, and `[compat]`
# requires 0.9.1, the first release that carries everything this harness needs of it:
#
#   * the optimizer step observer and `PhaseTimer` (GeometricOptimizers #78), which the decomposed
#     schema-v4 timings are measured through;
#   * the backend fixes that made a device-resident manifold parameter set usable (#79, #84, #85);
#   * `CompositeMethod`, which is how the `scalar-moment-adam` baseline is assembled over a mixed
#     tree — once, upstream, rather than once per trainer here;
#   * `scripts/retraction_records.jl`, the retraction benchmark, which lives beside the
#     algorithms it measures and which this harness invokes rather than reimplements.
#
# A source entry for `GeometricOptimizers` would make the versions every number depends on follow
# `main` rather than a release, so there is none: `Pkg.status` and the run bundle's manifest say
# which release a run used.
#
# `Manifest.toml` is not tracked — a manifest pinning a moving `main` commit goes stale the day
# after it is committed, and the run bundle already carries the one a run actually resolved, under
# `environments/scripts/`. Delete it whenever this `[sources]` block changes: an entry written while
# a source was named here keeps a `repo-url` and a `repo-rev`, and Pkg falls back to them where the
# project names no source, so `Pkg.update` would keep that commit and write the entry back into this
# file. Instantiate before a run, and refresh with `Pkg.update`, not `Pkg.resolve`: a `rev = "main"`
# source is a fixed pin to `resolve`, which reports the stale commit as satisfiable and leaves the
# environment behind `main` without saying so.
[sources]
# GeometricProblems 0.10 (the Dirichlet `LinearWave`) is unreleased; see the root `Project.toml`.
GeometricProblems = {url = "https://github.com/JuliaGNI/GeometricProblems.jl.git", rev = "linear-wave-dirichlet"}
GMLDatasets = {path = ".."}
GeometricMachineLearning = {url = "https://github.com/JuliaGNI/GeometricMachineLearning.jl.git", rev = "main"}

[compat]
GeometricMachineLearning = "0.8"
GeometricOptimizers = "0.9.1"
NeuralNetworkParameters = "0.5"
julia = "1.12"
